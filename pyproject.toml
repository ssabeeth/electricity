[project]
name = "elecprice"
version = "0.1.0"
description = "Day-ahead probabilistic forecasting of GB electricity prices, valued through battery arbitrage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sabeeth" }]
dependencies = [
    "duckdb>=1.1",
    "holidays>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "requests>=2.32",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Modelling, backtesting and experiment tracking.
ml = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "highspy>=1.7",
    "pulp>=2.9",
]
# Feature engineering. dbt runs in the same env so Airflow can call it via the CLI.
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
bigquery = [
    "dbt-bigquery>=1.8",
]
# Serving layer.
serve = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "plotly>=5.24",
    "streamlit>=1.39",
    "uvicorn[standard]>=0.32",
]
# Other model families, only for the model comparison (elec compare-models).
compare = [
    "catboost>=1.2",
    "xgboost>=2.1",
]

[project.scripts]
elec = "elecprice.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elecprice"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD", "NPY"]
ignore = [
    "RUF001", # allow unicode (e.g. £) in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["elecprice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test hits a live external API (deselected by default in CI)",
    "slow: test takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::FutureWarning:mlflow.*",
]
