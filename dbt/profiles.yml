# Two targets. `duckdb` is the default for local runs and CI; `bigquery` runs
# against a GCP project (docs/bigquery.md). BigQuery auth is the owner's own
# gcloud application-default login (`oauth`, the default) or a service-account
# key file (BQ_AUTH_METHOD=service-account); neither lives in the repository.
elecprice:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('ELEC_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC

    bigquery:
      type: bigquery
      method: "{{ env_var('BQ_AUTH_METHOD', 'oauth') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('GCP_PROJECT', 'set-GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'elecprice') }}"
      location: "{{ env_var('BQ_LOCATION', 'europe-west2') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      priority: interactive
