name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync pytest -m "not network" --cov=elecprice --cov-report=term

  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: duckdb
      ELEC_LAKE_DIR: ${{ github.workspace }}/tests/fixtures/lake
      ELEC_DUCKDB_PATH: /tmp/ci.duckdb
      FIXTURE_VARS: '{"feature_start_date": "2024-03-08", "feature_end_date": "2024-04-07"}'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dbt
      - name: dbt build on sample data (seeds, snapshots, models, tests, unit tests)
        working-directory: dbt
        run: uv run --no-sync dbt build --vars "$FIXTURE_VARS"
      - name: point-in-time canary must fail
        working-directory: dbt
        run: |
          if uv run --no-sync dbt build --select pit_canary_leaky \
               --vars '{"feature_start_date": "2024-03-08", "feature_end_date": "2024-04-07", "pit_canary": true}'; then
            echo "::error::leaky canary passed the point_in_time test"; exit 1
          fi
          echo "canary correctly rejected"

  airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.3.2"
      AIRFLOW_HOME: /tmp/airflow_home
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Airflow in its own environment (as in the Airflow image)
        run: |
          uv venv .venv-airflow --python 3.12
          uv pip install --python .venv-airflow/bin/python "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
      - name: DAG integrity tests
        run: .venv-airflow/bin/python -m pytest -q -p no:cacheprovider tests/airflow

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate the Compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build the app and Airflow images
        run: docker compose build
      - name: Smoke-test the images
        run: |
          docker run --rm elecprice-app:latest elec --version
          docker run --rm elecprice-app:latest python -c "import lightgbm, duckdb, mlflow, fastapi, streamlit"
          docker run --rm --entrypoint bash elecprice-airflow:latest -c '$ELEC_BIN --version && airflow version'
